<!doctype html>
<html lang="zh-Hant" data-color-version="orange-creative">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KZ 的內容筆記與延伸文章。">
  <meta name="theme-color" content="#eb670e">
  <meta name="robots" content="noindex,nofollow">
  <title>KZ — 內容筆記</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Noto+Sans+TC:wght@400;500;600;700;900&family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="notes.css">
  <script src="visual-content.js" defer></script>
  <script src="notes-content.js" defer></script>
</head>
<body>
  <header class="notes-nav">
    <nav aria-label="內容筆記導覽">
      <a class="notes-logo" href="visual-direction.html" data-logo-slot aria-label="回到 KZ 首頁"><span aria-hidden="true"></span></a>
      <strong data-content="notes.nav_title">內容筆記</strong>
      <a class="back-home" href="visual-direction.html"><span data-content="notes.back_label">回首頁</span> <b aria-hidden="true">↖</b></a>
    </nav>
  </header>

  <main>
    <section class="notes-hero">
      <p class="eyebrow" data-content="notes.eyebrow">KZ / NOTES</p>
      <h1 data-content="notes.headline">從一支影片開始，
把值得留下的內容整理在這裡。</h1>
      <p class="intro" data-content="notes.intro">Reels 裡沒有講完的想法、留言後想提供給你的內容，以及我正在學習和實際體驗的紀錄，都會慢慢放進來。</p>
    </section>

    <section class="notes-list" aria-labelledby="latest-notes">
      <div class="list-heading">
        <h2 id="latest-notes" data-content="notes.list_title">最新內容</h2>
        <span data-content="notes.list_status">持續更新</span>
      </div>
      <div class="notes-cards" data-resource-list hidden></div>
      <div class="empty-note" data-resource-empty>
        <span data-content="notes.empty_title">第一篇內容準備中</span>
        <p data-content="notes.empty_text">之後從 Instagram 留言取得的文章，都可以在這裡重新找到。</p>
      </div>
    </section>
  </main>

  <footer class="notes-footer">
    <span data-content="notes.footer_copyright">© 2026 KZ</span>
    <div>
      <a href="https://www.instagram.com/hi.imkz/" data-link="links.instagram.url" target="_blank" rel="noreferrer"><span data-content="links.instagram.label">Instagram</span> ↗</a>
      <a href="https://www.youtube.com/@hi_imkz" data-link="links.youtube.url" target="_blank" rel="noreferrer"><span data-content="links.youtube.label">YouTube</span> ↗</a>
    </div>
  </footer>
