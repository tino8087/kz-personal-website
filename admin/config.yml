backend:
  name: github
  repo: tino8087/kz-personal-website
  branch: main
  base_url: https://kz-personal-website.pages.dev
  auth_endpoint: /api/auth

local_backend: true
locale: zh_Hant
publish_mode: simple
site_url: https://kz-personal-website.pages.dev/
display_url: https://kz-personal-website.pages.dev/
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: visual_website
    label: 新版網站內容
    files:
      - name: visual_home
        label: KZ 網站全部內容
        file: content/visual-site.json
        format: json
        fields:
          - label: 網站基本資料
            name: site
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: 瀏覽器標題, name: title, widget: string, required: false }
              - { label: 搜尋說明, name: description, widget: text, required: false }
              - { label: 手機瀏覽器主題色, name: theme_color, widget: hidden, default: "#f2674a", required: false }
          - label: 網站配色
            name: theme
            widget: object
            required: false
            collapsed: false
            hint: 選擇版本後發布，前台整站會直接套用；選擇自訂配色時，會使用下方五個色彩欄位。
            fields:
              - label: 配色版本
                name: version
                widget: select
                required: false
                default: orange_creative
                options:
                  - { label: "Version 1｜Original", value: original }
                  - { label: "Version 2｜KZ Brand", value: kz_brand }
                  - { label: "Version 3｜KZ Orange × Blue", value: orange_creative }
                  - { label: "Version 4｜自訂配色", value: custom }
              - { label: 自訂 1｜主要品牌色, name: primary, widget: color, default: "#eb670e", required: false, hint: 大面積區塊、捲軸與主要識別色。 }
              - { label: 自訂 2｜深色, name: dark, widget: color, default: "#2a3582", required: false, hint: 文字、導覽列與深色背景。 }
              - { label: 自訂 3｜淺色, name: light, widget: color, default: "#ffffff", required: false, hint: 主要淺色背景與深色區塊上的文字。 }
              - { label: 自訂 4｜強調色, name: accent, widget: color, default: "#eb670e", required: false, hint: CTA、Hover 與少量重點。 }
              - { label: 自訂 5｜卡片色, name: card, widget: color, default: "#ffffff", required: false, hint: 卡片與次要區塊背景。 }
          - label: 最上方導覽列
            name: navigation
            widget: object
            required: false
            fields:
              - { label: 關於我, name: about_label, widget: string, required: false }
              - { label: 我在做什麼, name: creation_label, widget: string, required: false }
              - { label: 哪裡找到我？, name: links_label, widget: string, required: false }
              - { label: FOLLOW ME, name: follow_label, widget: string, required: false }
              - { label: FOLLOW ME 連結, name: follow_url, widget: string, required: false }
          - label: 首頁開場
            name: hero
            widget: object
            required: false
            fields:
              - { label: 小標, name: eyebrow, widget: string, required: false }
              - { label: 自我介紹, name: intro, widget: string, required: false }
              - { label: 核心大標, name: headline, widget: text, hint: 換行會保留。, required: false }
              - { label: 影片下方說明, name: summary, widget: text, required: false }
              - { label: 向下提示, name: scroll_label, widget: string, required: false }
              - { label: 影片左上標籤, name: video_label, widget: string, required: false }
              - { label: 尚未上傳時的文字, name: video_placeholder, widget: string, required: false }
              - { label: 開啟聲音文字, name: sound_on_label, widget: string, required: false }
              - { label: 關閉聲音文字, name: sound_off_label, widget: string, required: false }
              - label: 開場影片（16:9）
                name: media
                widget: object
                required: false
                fields:
                  - { label: 素材類型, name: type, widget: select, options: [{ label: 影片, value: video }, { label: 圖片, value: image }], required: false }
                  - { label: 上傳影片或圖片（1920 × 1080 px）, name: src, widget: file, required: false, hint: 影片建議 MP4／H.264、10–25 秒、20 MB 以內；單一檔案不可超過 25 MiB。 }
                  - { label: 影片封面（1920 × 1080 px）, name: poster, widget: image, required: false, hint: "16:9 橫式圖片。" }
                  - { label: 素材說明, name: alt, widget: string, required: false }
          - label: 關於我
            name: about
            widget: object
            required: false
            fields:
              - { label: 區塊小標, name: label, widget: string, required: false }
              - { label: 大標題, name: headline, widget: text, hint: 換行會保留。, required: false }
              - { label: 自我介紹, name: body, widget: text, required: false }
              - { label: 夢想小標, name: dream_label, widget: string, required: false }
              - { label: 夢想內容, name: dream, widget: text, required: false }
              - { label: 照片角落標籤, name: media_label, widget: string, required: false }
              - label: 人物／生活照片（4:5）
                name: media
                widget: object
                required: false
                fields:
                  - { label: 素材類型, name: type, widget: select, options: [{ label: 圖片, value: image }, { label: 影片, value: video }], required: false }
                  - { label: 上傳照片或影片（1600 × 2000 px）, name: src, widget: file, required: false, hint: "4:5 直式；人物與重點請放在畫面中央，桌機與手機都會自動裁切。" }
                  - { label: 影片封面（1600 × 2000 px）, name: poster, widget: image, required: false, hint: "4:5 直式圖片。" }
                  - { label: 素材說明, name: alt, widget: string, required: false }
          - label: 主要創作
            name: creation
            widget: object
            required: false
            fields:
              - { label: 區塊小標, name: label, widget: string, required: false }
              - { label: 捲動提示, name: scroll_label, widget: string, required: false }
              - label: 內容創作
                name: content
                widget: object
                required: false
                fields:
                  - { label: 編號, name: number, widget: string, required: false }
                  - { label: 下方進度名稱, name: tab_label, widget: string, required: false }
                  - { label: 標題, name: title, widget: string, required: false }
                  - { label: 說明, name: description, widget: text, required: false }
                  - { label: 點擊提示, name: detail_label, widget: string, required: false }
                  - { label: 點擊後前往網址, name: url, widget: string, required: false }
                  - { label: 占位主文字, name: word_one, widget: string, required: false }
                  - { label: 占位副文字, name: word_two, widget: string, required: false }
                  - { label: 卡片按鈕文字, name: footer_label, widget: string, required: false }
                  - { label: 卡片右下文字, name: footer_meta, widget: string, required: false }
                  - label: 卡片照片／影片（1:1）
                    name: media
                    widget: object
                    required: false
                    fields:
                      - { label: 素材類型, name: type, widget: select, options: [{ label: 圖片, value: image }, { label: 影片, value: video }], required: false }
                      - { label: 上傳照片或影片（1600 × 1600 px）, name: src, widget: file, required: false, hint: 正方形最能兼顧桌機與手機裁切；重點請放中央。 }
                      - { label: 影片封面（1600 × 1600 px）, name: poster, widget: image, required: false }
                      - { label: 素材說明, name: alt, widget: string, required: false }
              - label: IP 角色
                name: ip
                widget: object
                required: false
                fields:
                  - { label: 編號, name: number, widget: string, required: false }
                  - { label: 下方進度名稱, name: tab_label, widget: string, required: false }
                  - { label: 標題, name: title, widget: string, required: false }
                  - { label: 說明, name: description, widget: text, required: false }
                  - { label: 點擊提示, name: detail_label, widget: string, required: false }
                  - { label: 點擊後前往網址, name: url, widget: string, required: false }
                  - { label: 占位主文字, name: word_one, widget: string, required: false }
                  - { label: 占位副文字, name: word_two, widget: string, required: false }
                  - { label: 卡片按鈕文字, name: footer_label, widget: string, required: false }
                  - { label: 卡片右下文字, name: footer_meta, widget: string, required: false }
                  - label: 卡片照片／影片（1:1）
                    name: media
                    widget: object
                    required: false
                    fields:
                      - { label: 素材類型, name: type, widget: select, options: [{ label: 圖片, value: image }, { label: 影片, value: video }], required: false }
                      - { label: 上傳照片或影片（1600 × 1600 px）, name: src, widget: file, required: false, hint: 正方形最能兼顧桌機與手機裁切；重點請放中央。 }
                      - { label: 影片封面（1600 × 1600 px）, name: poster, widget: image, required: false }
                      - { label: 素材說明, name: alt, widget: string, required: false }
              - label: 穿搭日記
                name: outfit
                widget: object
                required: false
                fields:
                  - { label: 編號, name: number, widget: string, required: false }
                  - { label: 下方進度名稱, name: tab_label, widget: string, required: false }
                  - { label: 標題, name: title, widget: string, required: false }
                  - { label: 說明, name: description, widget: text, required: false }
                  - { label: 點擊提示, name: detail_label, widget: string, required: false }
                  - { label: 點擊後前往網址, name: url, widget: string, required: false }
                  - { label: 占位主文字, name: word_one, widget: string, required: false }
                  - { label: 占位副文字, name: word_two, widget: string, required: false }
                  - { label: 卡片按鈕文字, name: footer_label, widget: string, required: false }
                  - { label: 卡片右下文字, name: footer_meta, widget: string, required: false }
                  - label: 卡片照片／影片（1:1）
                    name: media
                    widget: object
                    required: false
                    fields:
                      - { label: 素材類型, name: type, widget: select, options: [{ label: 圖片, value: image }, { label: 影片, value: video }], required: false }
                      - { label: 上傳照片或影片（1600 × 1600 px）, name: src, widget: file, required: false, hint: 正方形最能兼顧桌機與手機裁切；重點請放中央。 }
                      - { label: 影片封面（1600 × 1600 px）, name: poster, widget: image, required: false }
                      - { label: 素材說明, name: alt, widget: string, required: false }
          - label: 最近也在學
            name: life
            widget: object
            required: false
            fields:
              - { label: 區塊小標, name: label, widget: string, required: false }
              - { label: 大標題, name: headline, widget: text, hint: 換行會保留。, required: false }
              - label: DJ 新手
                name: dj
                widget: object
                required: false
                fields:
                  - { label: 影像占位文字, name: media_word, widget: string, required: false }
                  - { label: 標題, name: title, widget: string, required: false }
                  - { label: 說明, name: note, widget: text, required: false }
                  - { label: 影像角落標籤, name: media_label, widget: string, required: false }
                  - label: 照片／影片（1:1）
                    name: media
                    widget: object
                    required: false
                    fields:
                      - { label: 素材類型, name: type, widget: select, options: [{ label: 圖片, value: image }, { label: 影片, value: video }], required: false }
                      - { label: 上傳照片或影片（1600 × 1600 px）, name: src, widget: file, required: false, hint: 正方形；人物或器材請放中央，會依螢幕比例裁切。 }
                      - { label: 影片封面（1600 × 1600 px）, name: poster, widget: image, required: false }
                      - { label: 素材說明, name: alt, widget: string, required: false }
              - label: 網球
                name: tennis
                widget: object
                required: false
                fields:
                  - { label: 影像占位文字, name: media_word, widget: string, required: false }
                  - { label: 標題, name: title, widget: string, required: false }
                  - { label: 說明, name: note, widget: text, required: false }
                  - { label: 影像角落標籤, name: media_label, widget: string, required: false }
                  - label: 照片／影片（1:1）
                    name: media
                    widget: object
                    required: false
                    fields:
                      - { label: 素材類型, name: type, widget: select, options: [{ label: 圖片, value: image }, { label: 影片, value: video }], required: false }
                      - { label: 上傳照片或影片（1600 × 1600 px）, name: src, widget: file, required: false, hint: 正方形；人物或動作請放中央，會依螢幕比例裁切。 }
                      - { label: 影片封面（1600 × 1600 px）, name: poster, widget: image, required: false }
                      - { label: 素材說明, name: alt, widget: string, required: false }
          - label: 哪裡找到我？
            name: links
            widget: object
            required: false
            fields:
              - { label: 區塊小標, name: label, widget: string, required: false }
              - label: Instagram
                name: instagram
                widget: object
                required: false
                fields:
                  - { label: 顯示名稱, name: label, widget: string, required: false }
                  - { label: 一句說明, name: description, widget: string, required: false }
                  - { label: 完整網址, name: url, widget: string, required: false }
              - label: YouTube
                name: youtube
                widget: object
                required: false
                fields:
                  - { label: 顯示名稱, name: label, widget: string, required: false }
                  - { label: 一句說明, name: description, widget: string, required: false }
                  - { label: 完整網址, name: url, widget: string, required: false }
              - label: Gmail
                name: gmail
                widget: object
                required: false
                fields:
                  - { label: 顯示名稱, name: label, widget: string, required: false }
                  - { label: 一句說明, name: description, widget: string, required: false }
                  - { label: Email 連結, name: url, widget: string, hint: "需保留 mailto: 開頭。", required: false }
              - { label: 頁尾版權文字, name: copyright, widget: string, required: false }
              - { label: 回到最上面文字, name: back_label, widget: string, required: false }
          - label: 內容筆記首頁
            name: notes
            widget: object
            required: false
            fields:
              - { label: 導覽列名稱, name: nav_title, widget: string, required: false }
              - { label: 回首頁文字, name: back_label, widget: string, required: false }
              - { label: 小標, name: eyebrow, widget: string, required: false }
              - { label: 大標題, name: headline, widget: text, hint: 換行會保留。, required: false }
              - { label: 介紹文字, name: intro, widget: text, required: false }
              - { label: 文章區標題, name: list_title, widget: string, required: false }
              - { label: 更新狀態, name: list_status, widget: string, required: false }
              - { label: 文章按鈕文字, name: read_label, widget: string, required: false }
              - { label: 沒有文章時的標題, name: empty_title, widget: string, required: false }
              - { label: 沒有文章時的說明, name: empty_text, widget: text, required: false }
              - { label: 頁尾版權文字, name: footer_copyright, widget: string, required: false }
  - name: resources
    label: 文章與下載內容
    files:
      - name: resource_library
        label: 內容庫
        file: content/resources.json
        format: json
        fields:
          - label: 文章與資源
            name: resources
            widget: list
            summary: '{{fields.title}} — {{fields.slug}}'
            fields:
              - { label: 已發布, name: published, widget: boolean, default: false, hint: 開啟後才會出現在正式網站。 }
              - { label: 標題, name: title, widget: string }
              - { label: 一句話說明, name: description, widget: text }
              - { label: 網址代稱, name: slug, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '只使用小寫英文、數字與連字號'] }
              - { label: 發布日期, name: published_date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
              - { label: 更新日期, name: updated_date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, required: false }
              - { label: 分類, name: category, widget: string, required: false }
              - label: 主要內容
                name: content
                widget: list
                fields:
                  - { label: 小標題, name: heading, widget: string, required: false }
                  - { label: 段落, name: paragraphs, widget: list, field: { label: 段落, name: paragraph, widget: text }, required: false }
                  - { label: 清單, name: items, widget: list, field: { label: 項目, name: item, widget: string }, required: false }
              - label: 實作區
                name: practical
                widget: object
                required: false
                fields:
                  - { label: 標題, name: heading, widget: string, required: false }
                  - { label: 項目, name: items, widget: list, field: { label: 項目, name: item, widget: text }, required: false }
              - label: 下載
                name: download
                widget: object
                required: false
                fields:
                  - { label: 按鈕文字, name: label, widget: string, required: false }
                  - { label: 檔案網址, name: url, widget: file, required: false }
              - label: 結尾按鈕
                name: cta
                widget: object
                required: false
                fields:
                  - { label: 按鈕文字, name: label, widget: string, required: false }
                  - { label: 連結, name: url, widget: string, required: false }
              - { label: SEO 標題, name: seo_title, widget: string, required: false }
              - { label: SEO 說明, name: seo_description, widget: text, required: false }
