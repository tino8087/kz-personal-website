backend:
  name: github
  repo: tino8087/kz-personal-website
  branch: main
  base_url: https://kz-personal-website.pages.dev
  auth_endpoint: /api/auth

local_backend: true
locale: zh_Hant
publish_mode: simple
site_url: https://kz-personal-website.pages.dev/visual-direction.html
display_url: https://kz-personal-website.pages.dev/visual-direction.html
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: visual_website
    label: 新版網站內容
    files:
      - name: visual_home
        label: KZ 網站全部內容
        file: content/visual-site.json
        format: json
        fields:
          - label: 網站基本資料
            name: site
            widget: object
            collapsed: true
            fields:
              - { label: 瀏覽器標題, name: title, widget: string }
              - { label: 搜尋說明, name: description, widget: text }
              - { label: 手機瀏覽器主題色, name: theme_color, widget: color }
          - label: 網站配色
            name: theme
            widget: object
            collapsed: true
            hint: 修改後會套用到電腦版與手機版，請保留足夠的文字對比。
            fields:
              - { label: 主橘色, name: orange, widget: color }
              - { label: 主黑色, name: black, widget: color }
              - { label: 米白色, name: cream, widget: color }
          - label: 最上方導覽列
            name: navigation
            widget: object
            fields:
              - { label: IP 角色 Logo, name: logo, widget: image, required: false, hint: 留白會顯示目前的圓形占位圖案。 }
              - { label: Logo 圖片說明, name: logo_alt, widget: string }
              - { label: 關於我, name: about_label, widget: string }
              - { label: 我在做什麼, name: creation_label, widget: string }
              - { label: 哪裡找到我？, name: links_label, widget: string }
              - { label: FOLLOW ME, name: follow_label, widget: string }
              - { label: FOLLOW ME 連結, name: follow_url, widget: string }
          - label: 首頁開場
            name: hero
            widget: object
            fields:
              - { label: 小標, name: eyebrow, widget: string }
              - { label: 自我介紹, name: intro, widget: string }
              - { label: 核心大標, name: headline, widget: text, hint: 換行會保留。 }
              - { label: 影片下方說明, name: summary, widget: text }
              - { label: 向下提示, name: scroll_label, widget: string }
              - { label: 影片左上標籤, name: video_label, widget: string }
              - { label: 尚未上傳時的文字, name: video_placeholder, widget: string }
              - { label: 開啟聲音文字, name: sound_on_label, widget: string }
              - { label: 關閉聲音文字, name: sound_off_label, widget: string }
              - label: 開場影片
                name: media
                widget: object
                fields:
                  - { label: 素材類型, name: type, widget: select, options: [{ label: 影片, value: video }, { label: 圖片, value: image }] }
                  - { label: 上傳影片或圖片, name: src, widget: file, required: false }
                  - { label: 影片封面, name: poster, widget: image, required: false }
                  - { label: 素材說明, name: alt, widget: string }
          - label: 關於我
            name: about
            widget: object
            fields:
              - { label: 區塊小標, name: label, widget: string }
              - { label: 大標題, name: headline, widget: text, hint: 換行會保留。 }
              - { label: 自我介紹, name: body, widget: text }
              - { label: 夢想小標, name: dream_label, widget: string }
              - { label: 夢想內容, name: dream, widget: text }
              - { label: 照片角落標籤, name: media_label, widget: string }
              - label: 人物／生活照片
                name: media
                widget: object
                fields:
                  - { label: 素材類型, name: type, widget: select, options: [{ label: 圖片, value: image }, { label: 影片, value: video }] }
                  - { label: 上傳照片或影片, name: src, widget: file, required: false }
                  - { label: 影片封面, name: poster, widget: image, required: false }
                  - { label: 素材說明, name: alt, widget: string }
          - label: 主要創作
            name: creation
            widget: object
            fields:
              - { label: 區塊小標, name: label, widget: string }
              - { label: 捲動提示, name: scroll_label, widget: string }
              - label: 內容創作
                name: content
                widget: object
                fields:
                  - { label: 編號, name: number, widget: string }
                  - { label: 下方進度名稱, name: tab_label, widget: string }
                  - { label: 標題, name: title, widget: string }
                  - { label: 說明, name: description, widget: text }
                  - { label: 點擊提示, name: detail_label, widget: string }
                  - { label: 點擊後前往網址, name: url, widget: string }
                  - { label: 占位主文字, name: word_one, widget: string }
                  - { label: 占位副文字, name: word_two, widget: string }
                  - { label: 卡片按鈕文字, name: footer_label, widget: string }
                  - { label: 卡片右下文字, name: footer_meta, widget: string }
                  - label: 卡片照片／影片
                    name: media
                    widget: object
                    fields:
                      - { label: 素材類型, name: type, widget: select, options: [{ label: 圖片, value: image }, { label: 影片, value: video }] }
                      - { label: 上傳照片或影片, name: src, widget: file, required: false }
                      - { label: 影片封面, name: poster, widget: image, required: false }
                      - { label: 素材說明, name: alt, widget: string }
              - label: IP 角色
                name: ip
                widget: object
                fields:
                  - { label: 編號, name: number, widget: string }
                  - { label: 下方進度名稱, name: tab_label, widget: string }
                  - { label: 標題, name: title, widget: string }
                  - { label: 說明, name: description, widget: text }
                  - { label: 點擊提示, name: detail_label, widget: string }
                  - { label: 點擊後前往網址, name: url, widget: string }
                  - { label: 占位主文字, name: word_one, widget: string }
                  - { label: 占位副文字, name: word_two, widget: string }
                  - { label: 卡片按鈕文字, name: footer_label, widget: string }
                  - { label: 卡片右下文字, name: footer_meta, widget: string }
                  - label: 卡片照片／影片
                    name: media
                    widget: object
                    fields:
                      - { label: 素材類型, name: type, widget: select, options: [{ label: 圖片, value: image }, { label: 影片, value: video }] }
                      - { label: 上傳照片或影片, name: src, widget: file, required: false }
                      - { label: 影片封面, name: poster, widget: image, required: false }
                      - { label: 素材說明, name: alt, widget: string }
              - label: 穿搭日記
                name: outfit
                widget: object
                fields:
                  - { label: 編號, name: number, widget: string }
                  - { label: 下方進度名稱, name: tab_label, widget: string }
                  - { label: 標題, name: title, widget: string }
                  - { label: 說明, name: description, widget: text }
                  - { label: 點擊提示, name: detail_label, widget: string }
                  - { label: 點擊後前往網址, name: url, widget: string }
                  - { label: 占位主文字, name: word_one, widget: string }
                  - { label: 占位副文字, name: word_two, widget: string }
                  - { label: 卡片按鈕文字, name: footer_label, widget: string }
                  - { label: 卡片右下文字, name: footer_meta, widget: string }
                  - label: 卡片照片／影片
                    name: media
                    widget: object
                    fields:
                      - { label: 素材類型, name: type, widget: select, options: [{ label: 圖片, value: image }, { label: 影片, value: video }] }
                      - { label: 上傳照片或影片, name: src, widget: file, required: false }
                      - { label: 影片封面, name: poster, widget: image, required: false }
                      - { label: 素材說明, name: alt, widget: string }
          - label: 最近也在學
            name: life
            widget: object
            fields:
              - { label: 區塊小標, name: label, widget: string }
              - { label: 大標題, name: headline, widget: text, hint: 換行會保留。 }
              - label: DJ 新手
                name: dj
                widget: object
                fields:
                  - { label: 影像占位文字, name: media_word, widget: string }
                  - { label: 標題, name: title, widget: string }
                  - { label: 說明, name: note, widget: text }
                  - { label: 影像角落標籤, name: media_label, widget: string }
                  - label: 照片／影片
                    name: media
                    widget: object
                    fields:
                      - { label: 素材類型, name: type, widget: select, options: [{ label: 圖片, value: image }, { label: 影片, value: video }] }
                      - { label: 上傳照片或影片, name: src, widget: file, required: false }
                      - { label: 影片封面, name: poster, widget: image, required: false }
                      - { label: 素材說明, name: alt, widget: string }
              - label: 網球
                name: tennis
                widget: object
                fields:
                  - { label: 影像占位文字, name: media_word, widget: string }
                  - { label: 標題, name: title, widget: string }
                  - { label: 說明, name: note, widget: text }
                  - { label: 影像角落標籤, name: media_label, widget: string }
                  - label: 照片／影片
                    name: media
                    widget: object
                    fields:
                      - { label: 素材類型, name: type, widget: select, options: [{ label: 圖片, value: image }, { label: 影片, value: video }] }
                      - { label: 上傳照片或影片, name: src, widget: file, required: false }
                      - { label: 影片封面, name: poster, widget: image, required: false }
                      - { label: 素材說明, name: alt, widget: string }
          - label: 哪裡找到我？
            name: links
            widget: object
            fields:
              - { label: 區塊小標, name: label, widget: string }
              - label: Instagram
                name: instagram
                widget: object
                fields:
                  - { label: 顯示名稱, name: label, widget: string }
                  - { label: 一句說明, name: description, widget: string }
                  - { label: 完整網址, name: url, widget: string }
              - label: YouTube
                name: youtube
                widget: object
                fields:
                  - { label: 顯示名稱, name: label, widget: string }
                  - { label: 一句說明, name: description, widget: string }
                  - { label: 完整網址, name: url, widget: string }
              - label: Gmail
                name: gmail
                widget: object
                fields:
                  - { label: 顯示名稱, name: label, widget: string }
                  - { label: 一句說明, name: description, widget: string }
                  - { label: Email 連結, name: url, widget: string, hint: "需保留 mailto: 開頭。" }
              - { label: 頁尾版權文字, name: copyright, widget: string }
              - { label: 回到最上面文字, name: back_label, widget: string }
          - label: 內容筆記首頁
            name: notes
            widget: object
            fields:
              - { label: 導覽列名稱, name: nav_title, widget: string }
              - { label: 回首頁文字, name: back_label, widget: string }
              - { label: 小標, name: eyebrow, widget: string }
              - { label: 大標題, name: headline, widget: text, hint: 換行會保留。 }
              - { label: 介紹文字, name: intro, widget: text }
              - { label: 文章區標題, name: list_title, widget: string }
              - { label: 更新狀態, name: list_status, widget: string }
              - { label: 文章按鈕文字, name: read_label, widget: string }
              - { label: 沒有文章時的標題, name: empty_title, widget: string }
              - { label: 沒有文章時的說明, name: empty_text, widget: text }
              - { label: 頁尾版權文字, name: footer_copyright, widget: string }
  - name: resources
    label: 文章與下載內容
    files:
      - name: resource_library
        label: 內容庫
        file: content/resources.json
        format: json
        fields:
          - label: 文章與資源
            name: resources
            widget: list
            summary: '{{fields.title}} — {{fields.slug}}'
            fields:
              - { label: 已發布, name: published, widget: boolean, default: false, hint: 開啟後才會出現在正式網站。 }
              - { label: 標題, name: title, widget: string }
              - { label: 一句話說明, name: description, widget: text }
              - { label: 網址代稱, name: slug, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '只使用小寫英文、數字與連字號'] }
              - { label: 發布日期, name: published_date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
              - { label: 更新日期, name: updated_date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, required: false }
              - { label: 分類, name: category, widget: string, required: false }
              - label: 主要內容
                name: content
                widget: list
                fields:
                  - { label: 小標題, name: heading, widget: string, required: false }
                  - { label: 段落, name: paragraphs, widget: list, field: { label: 段落, name: paragraph, widget: text }, required: false }
                  - { label: 清單, name: items, widget: list, field: { label: 項目, name: item, widget: string }, required: false }
              - label: 實作區
                name: practical
                widget: object
                required: false
                fields:
                  - { label: 標題, name: heading, widget: string, required: false }
                  - { label: 項目, name: items, widget: list, field: { label: 項目, name: item, widget: text }, required: false }
              - label: 下載
                name: download
                widget: object
                required: false
                fields:
                  - { label: 按鈕文字, name: label, widget: string, required: false }
                  - { label: 檔案網址, name: url, widget: file, required: false }
              - label: 結尾按鈕
                name: cta
                widget: object
                required: false
                fields:
                  - { label: 按鈕文字, name: label, widget: string, required: false }
                  - { label: 連結, name: url, widget: string, required: false }
              - { label: SEO 標題, name: seo_title, widget: string, required: false }
              - { label: SEO 說明, name: seo_description, widget: text, required: false }
